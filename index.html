:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel2:#EBEDE8; --line:#D6D9D2; --line2:#C3C7BE;
  --ink:#1D262C; --ink2:#5A6670; --ink3:#8A949C;
  --acc:#0F6E73; --acc-soft:#D8ECEC; --acc-ink:#0A5256;
  --warn:#9C6B12; --warn-soft:#F6E9CF; --neg:#A8322A; --neg-soft:#F5DCD9; --pos:#2C6E3A; --pos-soft:#DCEBDD;
  --cap:#E4E6DB; --sub:#EEF1EC; --grp:#F6F7F4; --th:#D9E6E5;
  --sh:0 1px 2px rgba(20,30,40,.08);
  --fs:11px;
}
:root[data-theme="dark"]{
  --bg:#12171B; --panel:#1A2126; --panel2:#222A31; --line:#2E373F; --line2:#3B4650;
  --ink:#E4E9EC; --ink2:#A7B2BA; --ink3:#6F7B84;
  --acc:#4FB2B7; --acc-soft:#173539; --acc-ink:#8ED6D9;
  --warn:#E0B25E; --warn-soft:#3A2E14; --neg:#E4776F; --neg-soft:#3F1F1C; --pos:#7CC28A; --pos-soft:#1C3521;
  --cap:#2E3439; --sub:#202932; --grp:#1C242B; --th:#1F3336;
  --sh:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;font-family:"Carlito",Calibri,"Segoe UI",sans-serif}
h1,h2,h3{font-size:inherit;line-height:inherit}
html{margin:0;min-height:100%}
body{margin:0;min-height:100vh}
body{background:var(--bg);color:var(--ink);font:400 var(--fs)/1.35 "Carlito",Calibri,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}

/* ---------- login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50}
#login .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:28px 30px;width:min(380px,92vw);box-shadow:var(--sh)}
#login h1{font-weight:700;text-decoration:underline;text-underline-offset:3px;margin:0 0 4px}
#login p{margin:0 0 18px;color:var(--ink2)}
#login input{width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);margin-bottom:10px}
#login button{width:100%;padding:8px;border:0;border-radius:6px;background:var(--acc);color:#fff;font-weight:700}
#login .err{color:var(--neg);min-height:18px;margin-top:8px;}

/* ---------- top bar ---------- */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.bar{display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand b{font-weight:700;}
.brand span{color:var(--ink2);}
nav{display:flex;align-items:stretch;gap:2px;flex:1;flex-wrap:wrap}
.tabs{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;margin-right:8px;align-self:center}
.tabs button{border:0;background:var(--panel);padding:5px 10px;color:var(--ink2);font-weight:700}
.tabs button.on{background:var(--acc);color:#fff}
.dd-tc{max-height:70vh;overflow:auto;min-width:340px}
.un{color:var(--ink3)}
.capa{max-width:960px;margin:6px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:28px 36px 30px;text-align:justify;hyphens:auto}
.capa-h{border-bottom:1px solid var(--line2);padding-bottom:16px;margin-bottom:18px}
.capa-t{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.capa-s{color:var(--ink2);margin-bottom:14px}
.capa-id{border-collapse:collapse;width:auto;min-width:0}
.capa-id th{position:static;background:none;border:0;text-align:left;padding:2px 18px 2px 0;color:var(--ink2);font-weight:700;width:90px}
.capa-id td{border:0;padding:2px 0}
.capa-b{line-height:1.7}
.capa-b h3{margin:26px 0 8px}
.capa-b p{margin:0 0 9px}
.capa-top{display:flex;justify-content:flex-end;max-width:960px;margin:0 auto 8px}
.capa-top button{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.capa-top button:hover{background:var(--panel2);color:var(--ink)}
.capa b{font-weight:700}
.car2{display:inline-block;width:0;height:0;border-left:5px solid var(--ink2);border-top:4px solid transparent;border-bottom:4px solid transparent;margin-right:5px;cursor:pointer;transform:rotate(90deg);transition:transform .15s;vertical-align:1px}
.car2.c{transform:rotate(0)}
.colbtn{border:1px solid var(--line2);background:var(--panel);border-radius:6px;padding:6px 10px;color:var(--ink2)}
.colbtn:hover{background:var(--panel2);color:var(--ink)}
.ng{color:var(--neg)}
.kpi .v .ng{color:var(--neg)}
nav .it{position:relative}
nav .it>button{background:none;border:0;border-radius:6px;padding:6px 9px;color:var(--ink2);font-weight:400;white-space:nowrap;display:flex;align-items:center;gap:5px}
nav .it>button:hover{background:var(--panel2);color:var(--ink)}
nav .it>button.on{background:var(--acc-soft);color:var(--acc-ink)}
nav .it>button .n{color:var(--ink3)}
nav .it>button.on .n{color:var(--acc-ink)}
nav .it>button .car{color:var(--ink3)}

/* ==================== CÁLCULO ==================== */
function useTab(t){ tab=t; const d=DS[t]; data=d.data; byKey=d.byKey; children=d.children; order=d.order; }
function build(){
  Object.keys(TABS).forEach(t=>{
    const d={data:JSON.parse(JSON.stringify(RAW[t])),byKey:{},children:{},order:[]};
    d.data.rows.forEach(r=>{ d.byKey[r.key]=r; d.order.push(r.key); d.children[r.key]=[]; });
    d.data.rows.forEach(r=>{ if(r.parent && d.children[r.parent]) d.children[r.parent].push(r.key); });
    DS[t]=d;
  });
  useTab(tab); compute();
}
function compute(){ const cur=tab; Object.keys(TABS).forEach(t=>{ useTab(t); computeTab(); }); useTab(cur); }
function itemsOf(key){
  const out=[]; (function walk(k){ (children[k]||[]).forEach(c=>{ const n=byKey[c]; if(n.type==='item') out.push(n); else walk(c); }); })(key); return out;
}
function corrOf(n){
  if(n.type!=='item') return null;
  const e=edits[ek(n.key)]; if(!e||!e.pct) return 0;
  const base = n.act ? n.act : (n.tot||0);   // acumulado; se 0, aplica-se ao Total LPU
  return (e.pct/100)*base;
}
function computeTab(){
  // items: fill missing
  data.rows.forEach(n=>{
    if(n.type==='item'){
      n.tot = n.tot!=null ? n.tot : ((n.q||0)*(n.pu||0));
      n.act = n.act!=null ? n.act : 0; n.acq = n.acq!=null ? n.acq : 0;
      n.st  = n.st!=null ? n.st : (n.tot - n.act); n.sq = n.sq!=null ? n.sq : ((n.q||0)-n.acq);
      n.corr = corrOf(n);
    }
  });
  // containers: sums of descendant items (from last to first so children are ready)
  for(let i=data.rows.length-1;i>=0;i--){
    const n=data.rows[i]; if(n.type==='item') continue;
    let tot=0,act=0,st=0,corr=0; const amt=data.ams.map(()=>0);
    (children[n.key]||[]).forEach(c=>{ const m=byKey[c]; tot+=m.tot||0; act+=m.act||0; st+=m.st||0; corr+=m.corr||0; (m.amT||m.am.map(a=>a[1]||0)).forEach((v,j)=>amt[j]+=v||0); });
    n.tot=tot; n.act=act; n.st=st; n.corr=corr; n.amT=amt;
  }
  data.rows.forEach(n=>{ if(n.type==='item') n.amT=n.am.map(a=>a[1]||0); });
  // pesos
  data.rows.forEach(n=>{
    let ref=null;
    if(n.type==='cap') ref=byKey[TABS[tab].total];
    else if(n.type==='sub') ref=byKey[capOf(n.key)];
    else if(n.type!=='total') ref=byKey[subOf(n.key)] || byKey[capOf(n.key)];
    n.peso = ref && ref.tot ? n.tot/ref.tot : null;
    n.exec = n.tot ? n.act/n.tot : null;
    n.falta = n.tot ? n.st/n.tot : null;
  });
}
function ancestors(key){ const a=[]; let p=byKey[key]&&byKey[key].parent; while(p){ a.push(p); p=byKey[p].parent; } return a; }
function capOf(key){ return ancestors(key).find(k=>byKey[k].type==='cap') || (byKey[key].type==='cap'?key:null); }
function subOf(key){ return ancestors(key).find(k=>byKey[k].type==='sub') || (byKey[key].type==='sub'?key:null); }

/* ==================== FORMATAÇÃO ==================== */
function fmt(v,dec=2){ if(v==null||isNaN(v)) return ''; const s=Math.abs(v).toFixed(dec); const neg=v<0 && Number(s)!==0; let [i,d]=s.split('.'); i=i.replace(/\B(?=(\d{3})+(?!\d))/g,' '); const out=i+(d?','+d:''); return neg?'<span class="ng">−'+out+'</span>':out; }
function eur(v){ if(v==null) return ''; const s=fmt(v,2); return s.endsWith('</span>')?s.replace('</span>',' €</span>'):s+' €'; }
function qty(v){ if(v==null||isNaN(v)) return ''; return fmt(v,3); }
function pct(v,dec=2){ if(v==null||isNaN(v)) return ''; const s=fmt(v*100,dec); return s.endsWith('</span>')?s.replace('</span>','%</span>'):s+'%'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

/* ==================== PESQUISA ==================== */
function matchWords(n){
  if(!filter) return true;
  const words = norm(filter).split(/\s+/).filter(Boolean);
  const hay = norm(n.key+' '+n.desc);
  return words.every(w=>hay.includes(w));
}
function hilite(text){
  if(!filter) return esc(text);
  const words = norm(filter).split(/\s+/).filter(Boolean);
  // mark on normalized positions -> approximate by regex on original with accent-insensitive char classes
  let out=esc(text);
  words.forEach(w=>{
    const rx = new RegExp(w.split('').map(ch=>{ const m={a:'[aáàãâä]',e:'[eéèêë]',i:'[iíìîï]',o:'[oóòõôö]',u:'[uúùûü]',c:'[cç]'}; return m[ch]||ch.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }).join(''),'gi');
    out = out.replace(rx, m=>'<mark>'+m+'</mark>');
  });
  return out;
}
function visibleRows(rootKeys){
  // rows in scope, respecting filter: matched rows + their ancestors
  const scope = new Set();
  rootKeys.forEach(rk=>{ scope.add(rk); (function walk(k){ (children[k]||[]).forEach(c=>{ scope.add(c); walk(c); }); })(rk); });
  const rows = order.filter(k=>scope.has(k)).map(k=>byKey[k]);
  if(!filter && !onlyEdited) return rows.map(n=>({n,hit:false}));
  const keep=new Set(), hits=new Set();
  rows.forEach(n=>{
    const e=edits[ek(n.key)];
    const ok = matchWords(n) && (!onlyEdited || (e && (e.pct || (e.obs&&e.obs.trim()))));
    if(ok && (n.type==='item' || !onlyEdited)){ hits.add(n.key); keep.add(n.key); ancestors(n.key).forEach(a=>keep.add(a)); }
  });
  return rows.filter(n=>keep.has(n.key)).map(n=>({n,hit:hits.has(n.key)}));
}

  });
  document.getElementById('nav').innerHTML=h;
}

function renderCapa(){

function capaSections(nc,ncTC,exTN,exTC,exO,exA,act,tot,corr){
  return `<h3>Introdução:</h3>
      <p>A informação prestada baseia-se na análise de todos os Autos Mensais aprovados pela Fiscalização e validados pelo Dono de Obra, em contraponto com a realidade verificada em Obra até 18/09/2026.</p>
      <h3>Análise:</h3>
      <p>Todos os Autos estão faturados, com exceção dos que se referem a Agosto — AM 17 nos TN e AM 14 nos TC — que ainda não estão aprovados pelo Dono de Obra.</p>
      <p>Todos os Autos faturados estão pagos.</p>
      <p>Considerando todos os Autos, Agosto incluído, estão executados <b>${pct(exTN)}</b> dos TN e <b>${pct(exTC)}</b> dos TC, o que perfaz <b>${pct(exO)}</b> da Obra (${eur(act)} em ${eur(tot)}).</p>
      <p>${nc}${ncTC}</p>
      <p>Considerados os Ajustes, na ordem dos <b>${eur(corr)}</b>, a execução passa para os <b>${pct(exA)}</b>.</p>
      <p>Sugere-se que estas correções sejam incorporadas no último Auto — AM 17, ainda não aprovado — ou num Auto de Situação à parte.</p>
      <h3>Considerações:</h3>
      <p>A eventual necessidade de um Ajuste nas Coberturas / Empenas não foi considerada, dada a ausência de ensaios, previstos para o dia 22/09.</p>
      <p>Os Ralos, apontados pelo Dono de Obra como tendo "problemas" — situação com a qual a Fiscalização concorda — nunca foram faturados / pagos.</p>
      <p>Relativamente à Impermeabilização, que está totalmente executada, a Fiscalização só permitiu a faturação / pagamento de 50% do trabalho, exatamente para que os restantes 50% sejam validados aquando dos ensaios.</p>
      <h3>Notas:</h3>
      <p>Os adiantamentos efetuados pelo Dono de Obra, e alvo de faturação à parte pelo Empreiteiro, à Casanova e à Topmarmi, foram vertidos nos Autos de Novembro de 2025 e Abril de 2026, sendo que as faturas desses Autos descontam os adiantamentos em causa para que, somadas, deem o valor total.</p>
      <p>O TC 007, relativo à Estrutura Metálica, não será realizado e, por isso, o seu saldo será sempre igual ao aprovado inicialmente. A pedido do Dono de Obra, este trabalho acabou por ser faturado e pago diretamente pela Manteigaria.</p>`;
}

/* ---------- PDF (impressão) ---------- */
function printPdf(){
  const old=document.getElementById('print'); if(old) old.remove();
  const div=document.createElement('div'); div.id='print'; div.innerHTML=buildPrint(); document.body.appendChild(div);
  const cur=document.documentElement.getAttribute('data-theme'); document.documentElement.setAttribute('data-theme','light');
  const done=()=>{ div.remove(); document.documentElement.setAttribute('data-theme',cur); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  setTimeout(()=>window.print(),150);
}

  const adjTN=itemsOf('TTN').filter(i=>edits[ek(i.key)]&&edits[ek(i.key)].pct); const capsTN=[...new Set(adjTN.map(i=>byKey[capOf(i.key)].desc))];
  const capsN=data.rows.filter(r=>r.type==='cap').map(c=>({...c})); const amsN=data.ams.map((a,j)=>({code:a.code,mes:a.mes,v:TN.amT[j]}));
  const adjRows=adjTN.map(i=>({key:i.key,cap:byKey[capOf(i.key)].key,sub:(byKey[subOf(i.key)]||{}).desc||'',desc:i.desc,act:i.act,pct:edits[ek(i.key)].pct,corr:i.corr,obs:edits[ek(i.key)].obs||''}));
  useTab('TC'); const adjTC=itemsOf('TTCm').filter(i=>edits[ek(i.key)]&&edits[ek(i.key)].pct);
  const capsC=data.rows.filter(r=>r.type==='cap').map(c=>({...c})); const amsC=data.ams.map((a,j)=>({code:a.code,mes:a.mes,v:TC.amT[j]}));
  adjTC.forEach(i=>adjRows.push({key:i.key,cap:byKey[capOf(i.key)].key,sub:'TC',desc:i.desc,act:i.act,pct:edits[ek(i.key)].pct,corr:i.corr,obs:edits[ek(i.key)].obs||''}));
  useTab(cur);
  const lst=a=>a.length<=1?a.join(''):a.slice(0,-1).join(', ')+' e '+a[a.length-1];
  const nc = adjTN.length ? `Foram detetadas ${adjTN.length} situação(ões) não conforme(s) nos TN, em ${lst(capsTN)}, explicadas nos Ajustes.` : 'Não foram detetadas situações não conformes nos TN.';
  const ncTC = adjTC.length ? ` Nos TC foram detetadas ${adjTC.length} situação(ões), igualmente explicadas nos Ajustes.` : '';

  // acumulado mensal da obra (TN+TC alinhados pelo mês)
  const mm={}; amsN.forEach(a=>{ mm[a.mes]=(mm[a.mes]||0)+a.v; }); amsC.forEach(a=>{ mm[a.mes]=(mm[a.mes]||0)+a.v; });

  const mxM=Math.max(...cum.map(x=>x.v),1);
  const cumChart=`<div class="pm">${cum.map(x=>`<div class="pmb"><b>${fmt(x.c/1000,0)}k</b><i style="height:${Math.max(2,x.v/mxM*100)}%;background:${B}"></i><span>${x.m}</span></div>`).join('')}</div>`;

}

    <tr><th class="r bl">Qtd</th><th class="r">Pr. Unit.</th><th class="r">Total</th>
    ${data.ams.map(()=>(both?'<th class="r bl">Qtd</th><th class="r">Total</th>':'<th class="r bl">Total</th>')).join('')}
    <th class="r bl">Qtd</th><th class="r">Total</th><th class="r bl">Qtd</th><th class="r">Total</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="99" class="empty">Sem resultados para a pesquisa.</td></tr>`;
  rows.forEach(({n,hit})=>{
    const isItem=n.type==='item', cont = n.type!=='item' && n.type!=='hdr' && n.type!=='nota';
    h += `<tr class="${n.type}${hit?' hit':''}" data-key="${n.key}" style="--ind:${Math.max(0,n.level-1)*12}px">
      <td class="id">${n.type==='total'?'':n.key}</td><td class="desc"><span class="t">${hilite(n.desc)}</span></td>
      <td class="num bl">${isItem?qty(n.q)+(n.un?' <span class="un">'+esc(n.un)+'</span>':''):''}</td><td class="num">${isItem?fmt(n.pu):''}</td><td class="num">${isItem||cont?fmt(n.tot):''}</td>`;
    data.ams.forEach((a,j)=>{
      const qv = isItem?n.am[j][0]:null, tv = isItem?n.am[j][1]:(cont?n.amT[j]:null);
      h += both ? `<td class="num bl amQ">${qty(qv)}</td><td class="num">${tv?fmt(tv):(tv===0&&isItem?'':'')}</td>` : `<td class="num bl">${tv?fmt(tv):''}</td>`;
    });
    h += `<td class="num bl amQ">${isItem?qty(n.acq):''}</td><td class="num">${isItem||cont?fmt(n.act):''}</td><td class="num bl amQ">${isItem?qty(n.sq):''}</td><td class="num">${isItem||cont?fmt(n.st):''}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  return h;
}

/* ---------- Capítulo / subcapítulo ---------- */
function renderCap(){
  const root = view.sub || view.cap; const n=byKey[root]; const cap=byKey[view.cap];
  const allC = allCollapsed(root);
  const chk = `<button class="colbtn" id="btnCol" title="${allC?'Expandir todas as secções':'Colapsar todas as secções'}">${allC?'Expandir Tudo':'Colapsar Tudo'}</button><label class="chk"><input type="checkbox" id="onlyEdited" ${onlyEdited?'checked':''}> Só Linhas c/Ajuste</label><label class="chk ${isValid(root)?'val':''}" title="${editMode?'Marcar este menu como analisado/validado':'Ative a edição para validar'}"><input type="checkbox" id="validado" ${isValid(root)?'checked':''} ${editMode?'':'disabled'}> Validado ${isValid(root)?LOCK:''}</label>`;
  let h = `<div class="view-h">${ctrlsHtml(chk)}</div>`;
  h += kpisFor(n);
  const rows = visibleRows([root]);
  h += `<div class="twrap"><div class="tscroll"><table class="fx"><colgroup><col style="width:46px"><col style="width:500px">${'<col style="width:74px">'.repeat(12)}<col style="min-width:240px"></colgroup><thead><tr>
    <th rowspan="2">Id</th><th rowspan="2">Descrição</th><th class="g" colspan="3">LPU</th><th class="g" colspan="2">Acumulado</th><th class="g" colspan="2">Saldo</th><th class="g" colspan="3">Peso</th><th class="g" colspan="2">Ajuste</th><th rowspan="2" class="bl">Observações</th></tr>
    <tr><th class="r bl">Qtd</th><th class="r">Pr. Unit.</th><th class="r">Total</th><th class="r bl">Qtd</th><th class="r">Total</th><th class="r bl">Qtd</th><th class="r">Total</th>
    <th class="r bl" title="Peso da linha no subcapítulo / do subcapítulo no capítulo / do capítulo no total">LPU</th><th class="r" title="Acumulado ÷ LPU">Acum</th><th class="r" title="Saldo ÷ LPU">Saldo</th>
    <th class="r bl" title="Ajuste em % do valor acumulado (− desconta, + acrescenta); se o acumulado for 0, aplica-se ao Total LPU">%</th><th class="r" title="Ajuste % × Acumulado (ou × Total LPU se acumulado = 0)">Valor</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="99" class="empty">Sem resultados.</td></tr>`;
  const col=collapsed[tab];
  rows.forEach(({n,hit})=>{ if(!filter && n.key!==root && ancestors(n.key).some(a=>a!==root&&col.has(a)||a===root&&col.has(a))) return; h+=rowHtml(n,hit); });
  h += `</tbody></table></div></div>`;
  return h;
}
function rowHtml(n,hit){
  const isItem=n.type==='item', cont=n.type!=='item'&&n.type!=='hdr'&&n.type!=='nota';
  const e=edits[ek(n.key)]||{}; const hasAdj=isItem&&e.pct;
  const val=isItem?(n.corr||0):(cont?(n.corr||0):null);
  return `<tr class="${n.type}${hit?' hit':''}${hasAdj?' hasadj':''}" data-key="${n.key}" style="--ind:${Math.max(0,n.level-2)*12}px">
    <td class="id">${(children[n.key]||[]).length?`<span class="car2 ${collapsed[tab].has(n.key)?'c':''}" data-tog="${n.key}" title="Colapsar / expandir"></span>`:''}${n.type==='total'?'':n.key}</td><td class="desc"><span class="t">${hilite(n.desc)}</span></td>
    <td class="num bl">${isItem?qty(n.q)+(n.un?' <span class="un">'+esc(n.un)+'</span>':''):''}</td><td class="num">${isItem?fmt(n.pu):''}</td><td class="num">${isItem||cont?fmt(n.tot):''}</td>
    <td class="num bl amQ">${isItem?qty(n.acq):''}</td><td class="num">${isItem||cont?fmt(n.act):''}</td>
    <td class="num bl amQ">${isItem?qty(n.sq):''}</td><td class="num">${isItem||cont?fmt(n.st):''}</td>
    <td class="pct bl ${cont?'':'dim'}">${isItem||cont?pct(n.peso):''}</td><td class="pct ${cont?'':'dim'}">${isItem||cont?pct(n.exec):''}</td><td class="pct ${cont?'':'dim'}">${isItem||cont?pct(n.falta):''}</td>
    <td class="adj bl">${isItem?(editMode?`<input type="number" step="1" data-f="pct" value="${e.pct!=null?e.pct:''}" placeholder="%">`:(e.pct?fmt(e.pct,2)+'%':'')):''}</td>
    <td class="val ${val<0?'neg':val>0?'pos':''}">${val?eur(val):''}</td>
    <td class="obs bl">${editMode?`<input type="text" data-f="obs" value="${esc(e.obs||'')}" placeholder="…">`:`<span class="t">${esc(e.obs||'')}</span>`}</td></tr>`;
}

/* ==================== CABEÇALHO FORA DO SCROLL ==================== */
function splitTables(){
  document.querySelectorAll('.twrap').forEach(w=>{
    const sc=w.querySelector('.tscroll'); const tb=sc&&sc.querySelector('table'); if(!tb||!tb.tHead) return;
    const row=tb.tBodies[0]&&tb.tBodies[0].rows[0]; if(!row) return;
    const cells=[...row.cells]; if(cells.some(c=>c.colSpan>1)) return;
    const widths=cells.map(c=>c.getBoundingClientRect().width); const total=widths.reduce((a,b)=>a+b,0);
    const cg='<colgroup>'+widths.map(x=>`<col style="width:${x}px">`).join('')+'</colgroup>';
    const ht=document.createElement('table'); ht.className=tb.className; ht.style.cssText=`table-layout:fixed;width:${total}px;min-width:${total}px`;
    ht.innerHTML=cg; ht.appendChild(tb.tHead);
    const hw=document.createElement('div'); hw.className='thw'; hw.appendChild(ht); w.insertBefore(hw,sc);
    const old=tb.querySelector('colgroup'); if(old) old.remove();
    tb.insertAdjacentHTML('afterbegin',cg); tb.style.cssText=`table-layout:fixed;width:${total}px;min-width:${total}px`;
    sc.addEventListener('scroll',()=>{ hw.scrollLeft=sc.scrollLeft; if(px) px.scrollLeft=sc.scrollLeft; });
    // barra de scroll horizontal fixa ao fundo do ecrã (visível sem ir ao fim da tabela)
    let px=null; if(total>sc.clientWidth+2){ px=document.createElement('div'); px.className='hscroll'; px.innerHTML=`<div style="width:${total}px;height:1px"></div>`; w.appendChild(px); px.addEventListener('scroll',()=>{ if(sc.scrollLeft!==px.scrollLeft) sc.scrollLeft=px.scrollLeft; }); }
    hw.style.top=document.querySelector('header').offsetHeight+'px';
    if(tb.classList.contains('rs')) centerNumbers(tb,widths);
  });
}
const _cv=document.createElement('canvas').getContext('2d');
function centerNumbers(tb,widths){
  // alinhar à direita com indentação igual dos dois lados (como o Excel), para os números ficarem centrados sob o cabeçalho
  _cv.font=getComputedStyle(tb).font;
  const rows=[...tb.tBodies[0].rows];
  widths.forEach((w,c)=>{
    const tds=rows.map(r=>r.cells[c]).filter(td=>td&&(td.classList.contains('num')||td.classList.contains('pct')||td.classList.contains('val')));
    if(!tds.length) return;
    const maxW=Math.max(...tds.map(td=>_cv.measureText(td.textContent.trim()).width));
    const pad=Math.max(8,Math.round((w-maxW)/2));
    tds.forEach(td=>{ td.style.paddingRight=pad+'px'; });
  });
}
let rsT; window.addEventListener('resize',()=>{ clearTimeout(rsT); rsT=setTimeout(()=>{ if(document.getElementById('login').style.display==='none') render(); },200); });

/* ==================== INTERAÇÃO ==================== */
function bindTable(){
  splitTables();
  const q=document.getElementById('q');
  if(q){ q.addEventListener('input',()=>{ filter=q.value; const pos=q.selectionStart; render(); const nq=document.getElementById('q'); nq.focus(); nq.setSelectionRange(pos,pos); }); updCount(); }
  const oe=document.getElementById('onlyEdited'); if(oe) oe.addEventListener('change',()=>{ onlyEdited=oe.checked; render(); });
  document.querySelectorAll('[data-tog]').forEach(s=>s.addEventListener('click',()=>{ const k=s.dataset.tog; const col=collapsed[tab]; col.has(k)?col.delete(k):col.add(k); rerenderKeepScroll(); }));
  const bc=document.getElementById('btnCol'); if(bc) bc.addEventListener('click',()=>{ const root=view.sub||view.cap; const col=collapsed[tab]; if(allCollapsed(root)) sectionsOf(root).forEach(k=>col.delete(k)); else sectionsOf(root).forEach(k=>col.add(k)); rerenderKeepScroll(); });
  const bp=document.getElementById('btnPdf'); if(bp) bp.addEventListener('click',printPdf);
  const vd=document.getElementById('validado'); if(vd) vd.addEventListener('change',()=>{ setValid(view.sub||view.cap, vd.checked); render(); });
  document.querySelectorAll('[data-am]').forEach(b=>b.addEventListener('click',()=>{ amMode=b.dataset.am; render(); }));
  document.querySelectorAll('td input[data-f]').forEach(inp=>{
    inp.addEventListener('change',()=>onEdit(inp));
    inp.addEventListener('keydown',ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); const all=[...document.querySelectorAll(`td input[data-f="${inp.dataset.f}"]`)]; const i=all.indexOf(inp); if(all[i+1]) all[i+1].focus(); } });
  });
}
function updCount(){ const c=document.getElementById('qcnt'); if(!c) return; const n=document.querySelectorAll('tbody tr.item').length; c.textContent = filter? n+' art.' : ''; }
function onEdit(inp){
  const tr=inp.closest('tr'); const key=tr.dataset.key; const n=byKey[key]; const K=ek(key);
  edits[K]=edits[K]||{};
  if(inp.dataset.f==='pct'){ const v=parseFloat(String(inp.value).replace(',','.')); edits[K].pct = isNaN(v)?0:v; if(!edits[K].pct) delete edits[K].pct; }
  else { edits[K].obs = inp.value; if(!edits[K].obs.trim()) delete edits[K].obs; }
  if(!Object.keys(edits[K]).length) delete edits[K];
  saveEdits(); compute(); queueSave(K);
  // update row + ancestors in place
  [key,...ancestors(key)].forEach(k=>{ const r=document.querySelector(`tr[data-key="${CSS.escape(k)}"]`); if(!r) return; const m=byKey[k]; const val=m.corr||0; const vt=r.querySelector('td.val'); if(vt){ vt.innerHTML=val?eur(val):''; vt.className='val '+(val<0?'neg':val>0?'pos':''); } if(m.type==='item') r.classList.toggle('hasadj',!!(edits[ek(k)]&&edits[ek(k)].pct)); });
  // KPIs
  const root = view.sub||view.cap; if(root){ const wrap=document.querySelector('.kpis'); if(wrap) wrap.outerHTML=kpisFor(byKey[root]); }
}
const pending={}; function queueSave(key){ clearTimeout(pending[key]); pending[key]=setTimeout(async()=>{ try{ await sbSaveEdit(key); setSbStatus(true); toast('Guardado'); }catch(err){ setSbStatus(false,'Erro Supabase: '+err.message); toast('Guardado só neste browser (Supabase: '+err.message.slice(0,60)+')'); } },400); }
document.getElementById('nav').addEventListener('click',ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ if(b.dataset.tab!==tab){ useTab(b.dataset.tab); sessionStorage.setItem('lsd_as_tab',tab); document.getElementById('brandSub').textContent='Largo de São Domingos · '+TABS[tab].label; view={type:'resumo',cap:null,sub:null}; filter=''; } closeDd(); render(); return; }
  if(b.dataset.v){ view={type:b.dataset.v,cap:null,sub:null}; filter=''; closeDd(); render(); return; }
  const it=b.closest('.it');
  if(b.parentElement===it){ // top chapter button
    const open=it.classList.contains('open'); closeDd(); if(!open) it.classList.add('open'); return;
  }
  if(b.dataset.cap!==undefined){ view={type:'cap',cap:b.dataset.cap,sub:b.dataset.sub||null}; filter=''; closeDd(); render(); }
});
function closeDd(){ document.querySelectorAll('.it.open,.dd.open').forEach(x=>x.classList.remove('open')); }
document.addEventListener('click',ev=>{ if(!ev.target.closest('.it')&&!ev.target.closest('.tools .dd')) closeDd(); });

/* edição */
document.getElementById('btnEdit').addEventListener('click',()=>{
  if(editMode){ setEdit(false); return; }

function setEdit(on){ editMode=on; const b=document.getElementById('btnEdit'); b.classList.toggle('on',on); b.title=on?'Edição ativa — clique para voltar a leitura':'Leitura — clique para ativar a edição';
  b.querySelector('svg').innerHTML = on?'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/>':'<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'; render(); }

/* tema */

document.getElementById('btnTheme').addEventListener('click',()=>setTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));

  expXlsx(){ exportXlsx(); },

};
function exportXlsx(){
  const aoa=[['Id','Descrição','Qtd','Pr Unit','Total LPU','Acum Qtd','Acum Total','Saldo Qtd','Saldo Total','Peso','Exec.','Falta','Ajuste %','Valor correção','Observações']];
  data.rows.forEach(n=>{ const isItem=n.type==='item', cont=n.type!=='item'&&n.type!=='hdr'&&n.type!=='nota'; const e=edits[ek(n.key)]||{};
    aoa.push([n.type==='total'?'':n.key,n.desc,isItem?n.q:null,isItem?n.pu:null,(isItem||cont)?n.tot:null,isItem?n.acq:null,(isItem||cont)?n.act:null,isItem?n.sq:null,(isItem||cont)?n.st:null,(isItem||cont)?n.peso:null,(isItem||cont)?n.exec:null,(isItem||cont)?n.falta:null,isItem&&e.pct?e.pct/100:null,(isItem||cont)&&n.corr?n.corr:null,e.obs||'']); });
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  const rng=XLSX.utils.decode_range(ws['!ref']);
  for(let R=1;R<=rng.e.r;R++){ [2,3,4,5,6,7,8,13].forEach(C=>{ const c=ws[XLSX.utils.encode_cell({r:R,c:C})]; if(c&&typeof c.v==='number') c.z='#,##0.00'; }); [9,10,11,12].forEach(C=>{ const c=ws[XLSX.utils.encode_cell({r:R,c:C})]; if(c&&typeof c.v==='number') c.z='0.0%'; }); }
  ws['!cols']=[{wch:11},{wch:70},{wch:9},{wch:11},{wch:13},{wch:9},{wch:13},{wch:9},{wch:13},{wch:8},{wch:8},{wch:8},{wch:9},{wch:13},{wch:40}];
  ws['!freeze']={xSplit:2,ySplit:1};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Auto de Situação '+tab);
  XLSX.writeFile(wb,`LSD_Auto_Situacao_${tab}_${stamp()}.xlsx`);
}
function stamp(){ const d=new Date(),p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }
let toastT; function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1800); }

async function enter(){

}
if(sessionStorage.getItem('lsd_as_ok')==='1') enter(); else document.getElementById('pw').focus();
